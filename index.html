<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>今天吃啥 · 分开转</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:#f4f6f4; color:#1c2620; font-family:PingFang SC,Hiragino Sans GB,Microsoft YaHei,system-ui,sans-serif; }
.wrap { max-width:680px; margin:0 auto; padding:16px 16px 40px; }
h1 { font-size:22px; font-weight:600; color:#14231a; letter-spacing:-0.02em; }
.sub { font-size:13px; color:#6b7670; margin-top:4px; line-height:1.5; }
.src { font-size:11px; color:#8a948d; margin-top:8px; }
.topbtns { margin-top:10px; }
.tbtn { display:inline-block; border:1px solid #d5ddd6; background:#fff; color:#2a3a30;
        font-size:12px; padding:6px 12px; border-radius:16px; margin:0 8px 8px 0; cursor:pointer; }

/* 三个层级标签 */
.tabs { margin-top:12px; display:flex; gap:6px; background:#eef2ef; padding:4px; border-radius:12px; }
.tab { flex:1; text-align:center; font-size:13px; color:#5a6660; padding:8px 0; border-radius:9px;
       cursor:pointer; transition:background .16s,color .16s; }
.tab b { font-weight:600; }
.tab .n { font-size:10px; color:#98a29b; margin-left:3px; }
.tab.on { background:#fff; color:#0f7a35; box-shadow:0 1px 3px rgba(20,40,28,.10); }
.tab.on .n { color:#5aa877; }

/* 当前选择 */
.picks { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; min-height:26px; }
.pick { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#14231a;
        background:#fff; border:1px solid #dfe7e2; border-radius:14px; padding:4px 6px 4px 10px; }
.pick i { font-style:normal; color:#98a29b; font-size:10px; }
.pick .x { width:16px; height:16px; line-height:15px; text-align:center; border-radius:50%;
           background:#f1f5f2; color:#7d8b84; cursor:pointer; font-size:11px; }
.pick.none { color:#a6afa9; background:transparent; border-style:dashed; }

.stage { position:relative; }
.wheelbox { position:relative; width:min(330px,82vw); aspect-ratio:1/1; margin:6px auto 0; }
#rotor { position:absolute; left:0; top:0; width:100%; height:100%;
         transition:transform 3s cubic-bezier(0.12,0.8,0.08,1); }
.pointer { position:absolute; top:-9px; left:50%; margin-left:-11px; width:22px; height:27px; z-index:3; }
#hub { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
       width:66px; height:66px; border-radius:50%; background:#fff; border:1px solid #dfe5e0;
       color:#14231a; font-size:19px; font-weight:600; cursor:pointer; z-index:2;
       box-shadow:0 2px 8px rgba(20,40,28,.10); }
#hub:disabled { color:#98a29b; }
.hint { text-align:center; font-size:11px; color:#8a948d; margin-top:10px; line-height:1.6; }

.result { margin-top:12px; background:#fff; border:1px solid #e6eae6; border-radius:14px;
          padding:14px 16px; text-align:left; box-shadow:0 2px 10px rgba(20,40,28,.05); }
.rrow { display:flex; align-items:center; }
.rimg { width:50px; height:50px; border-radius:10px; margin-right:12px; background:#eef1ee; flex:none; }
.rname { font-size:15px; font-weight:600; color:#14231a; line-height:1.35; }
.rmeta { font-size:12px; color:#6b7670; margin-top:3px; }
.rpick { font-size:13px; color:#0f7a35; font-weight:600; margin-top:6px; }
.rbtns { margin-top:10px; }
.go { display:inline-block; background:#17b04b; color:#fff; font-size:13px; padding:8px 16px;
      border-radius:8px; text-decoration:none; margin-right:8px; }

.sec { margin-top:22px; font-size:15px; font-weight:600; color:#14231a; }
.count { font-size:11px; color:#8a948d; font-weight:normal; margin-left:6px; }
.searchrow { margin-top:10px; display:flex; gap:8px; }
.searchrow input { flex:1; min-width:0; border:1px solid #d5ddd6; border-radius:8px;
                   padding:9px 10px; font-size:13px; color:#1c2620; background:#fff; }
.minibtn { border:1px solid #d5ddd6; background:#fff; color:#2a3a30; font-size:12px;
           padding:0 12px; border-radius:8px; cursor:pointer; }
.list { margin-top:10px; max-height:420px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.row { background:#fff; border:1px solid #e6eae6; border-radius:10px; padding:9px 10px; margin-bottom:7px; }
.rowtop { display:flex; align-items:center; }
.row img { width:34px; height:34px; border-radius:8px; margin-right:9px; background:#eef1ee; flex:none; }
.rinfo { flex:1; min-width:0; }
.rn { font-size:13px; color:#1c2620; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rm { font-size:10px; color:#8a948d; margin-top:2px; }
.sw { width:40px; height:23px; border-radius:23px; background:#cfd6d1; position:relative;
      flex:none; transition:background .2s; cursor:pointer; margin-left:8px; }
.sw::after { content:''; position:absolute; top:2px; left:2px; width:19px; height:19px;
             border-radius:50%; background:#fff; transition:transform .2s cubic-bezier(.34,1.56,.64,1); }
.sw.on { background:#17b04b; }
.sw.on::after { transform:translateX(17px); }
.dishes { margin-top:6px; display:flex; flex-wrap:wrap; gap:5px; }
.dtag { font-size:10px; color:#5a6660; background:#f4f8f5; border:1px solid #e6eee9;
        border-radius:10px; padding:2px 7px; }
.dedit { font-size:10px; color:#0f7a35; border:1px dashed #b9dcc6; border-radius:10px;
         padding:2px 7px; cursor:pointer; background:#fff; }

.hist { margin-top:10px; }
.chip { display:inline-block; background:#fff; border:1px solid #e6eae6; border-radius:12px;
        font-size:11px; color:#5a6660; padding:4px 10px; margin:0 6px 6px 0; }
.chip b { color:#1c2620; font-weight:600; }
.empty { margin-top:16px; background:#fff; border:1px solid #e6eae6; border-radius:14px;
         padding:26px; text-align:center; color:#8a948d; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>今天吃啥</h1>
  <div class="sub">三个盘分开转，先转哪个都行</div>
  <div class="src" id="src">正在拉取店铺…</div>
  <div class="topbtns">
    <a class="tbtn" id="refresh">重新拉取</a>
    <a class="tbtn" id="copybtn">复制链接</a>
    <a class="tbtn" id="clearAll">清空选择</a>
  </div>

  <div class="tabs">
    <div class="tab on" data-lv="1">餐厅<span class="n" id="n1"></span></div>
    <div class="tab" data-lv="2">窗口<span class="n" id="n2"></span></div>
    <div class="tab" data-lv="3">菜品<span class="n" id="n3"></span></div>
  </div>

  <div class="picks" id="picks"></div>

  <div class="stage">
    <div class="wheelbox">
      <div id="rotor"><svg id="svg" width="100%" height="100%" viewBox="0 0 340 340"></svg></div>
      <svg class="pointer" viewBox="0 0 22 27"><path d="M11 26 1 2h20L11 26Z" fill="#17b04b"/></svg>
      <button id="hub" type="button">转</button>
    </div>
    <div class="hint" id="hint"></div>

    <div class="result" id="result" style="display:none">
      <div class="rrow">
        <img class="rimg" id="rimg" alt="">
        <div style="min-width:0">
          <div class="rname" id="rname"></div>
          <div class="rmeta" id="rmeta"></div>
          <div class="rpick" id="rpick"></div>
        </div>
      </div>
      <div class="rbtns">
        <a class="go" id="go" href="#">去点单</a>
      </div>
    </div>
  </div>

  <div class="sec">全部店铺 <span class="count" id="cnt"></span></div>
  <div class="searchrow">
    <input id="q" type="text" placeholder="搜店名，比如 面 / 麻辣 / D">
    <button class="minibtn" id="allOn">全选</button>
    <button class="minibtn" id="allOff">全不选</button>
  </div>
  <div class="list" id="list"></div>

  <div class="sec">最近转到 <span class="count" id="clr" style="cursor:pointer">清空</span></div>
  <div class="hist" id="hist"></div>
</div>

<script>
var API='https://waimai.xyan.cn';
var H5='https://waimai.xyan.cn/user/#/pages/index/index';
var TENANT={appid:'hbdfxy', site:'128052'};

var CAT_SHADES=['#e6f2ea','#ffffff','#dcefe3','#f4f9f5','#e9f4ec','#fbfdfc','#d5e9dd','#eef7f1','#e1f0e7','#ffffff'];
var DISH_SHADES=['#eef7f1','#ffffff','#e4f2e9','#f7fbf8','#eaf5ee','#fdfefd'];
var DEFAULT_DISHES=['主食','小吃','饮品','套餐'];
var DISH_RULES=[
  [/奶茶|饮品|茶|咖啡|果茶|柠檬|酸奶/i, ['招牌奶茶','果茶','纯茶','小料']],
  [/汉堡|炸鸡|鸡排|肯德|麦当劳|堡/i,    ['汉堡','炸物','小食','饮料']],
  [/麻辣烫|冒菜|麻辣|串串|香锅/i,         ['自选菜','主食','饮品','小料']],
  [/面|粉|米线|米粉|螺蛳|拉面|刀削|凉皮/i, ['汤面','拌面','加料','小食']],
  [/饺|馄饨|云吞|包子|蒸饺|小笼/i,        ['水饺','馄饨','蒸点','小菜']],
  [/粥|早餐|豆浆|油条|煎饼|饼|馍/i,       ['粥品','饼类','早点','小菜']],
  [/烧烤|烤串|炸串|铁板|烤冷面/i,        ['烤串','主食','凉菜','饮料']],
  [/水果|超市|便利|零食/i,               ['水果','零食','饮料','日用']],
  [/饭|盖饭|炒饭|快餐|便当|套餐|自选/i,   ['盖饭','小炒','汤品','饮料']],
  [/水煮|鱼|鸡|锅|小炒|家常/i,           ['招牌菜','素菜','汤','主食']]
];
function dishesFor(shop){
  if(shop.dishes && shop.dishes.length) return shop.dishes;          // 用户改过的优先
  var name=String(shop.shop_name||'');
  for(var i=0;i<DISH_RULES.length;i++){
    if(DISH_RULES[i][0].test(name)) return DISH_RULES[i][1];
  }
  return DEFAULT_DISHES;
}


var shops=[], cats=[], enabled={}, histArr=[];
var level=1;                                  // 当前正在转的层级
var picked={ cate:null, shop:null, dish:null };// 各自独立
var rotation={ 1:0, 2:0, 3:0 };
var spinning=false, wheelItems=[];

function esc(s){ return String(s==null?'':s).replace(/[<>&"']/g,function(c){
  return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]; }); }
function key(s){ return String(s.shop_id); }
function pool(){ return shops.filter(function(s){ return enabled[key(s)]; }); }
function darken(hex,amt){ if(!hex||hex[0]!=='#') return hex;
  var v=parseInt(hex.slice(1),16);
  var r=Math.max(0,((v>>16)&255)-amt), g=Math.max(0,((v>>8)&255)-amt), b=Math.max(0,(v&255)-amt);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
function trunc(s,n){ s=String(s||'').trim(); return s.length>n? s.slice(0,n)+'…' : s; }

/* ---------- 存储 ---------- */
function saveLocal(){
  try{
    localStorage.setItem('xw6-shops',JSON.stringify({shops:shops,cats:cats,enabled:enabled}));
    localStorage.setItem('xw6-hist',JSON.stringify(histArr.slice(0,12)));
    localStorage.setItem('xw6-pick',JSON.stringify(picked));
  }catch(e){}
}
function loadLocal(){
  try{
    var raw=localStorage.getItem('xw6-shops');
    var p=localStorage.getItem('xw6-pick'); if(p){ var pp=JSON.parse(p); if(pp) picked=pp; }
    if(raw){ var d=JSON.parse(raw);
      if(d.shops&&d.shops.length){ shops=d.shops; cats=d.cats||[]; enabled=d.enabled||{};
        shops.forEach(function(s){ if(!(key(s) in enabled)) enabled[key(s)]=1;
          if(!s.dishes||!s.dishes.length) s.dishes=null; });
        return true; } }
    var h=localStorage.getItem('xw6-hist'); if(h) histArr=JSON.parse(h);
  }catch(e){}
  return false;
}

/* ---------- 请求 ---------- */
function postJSON(path,data){
  return new Promise(function(resolve){
    var x=new XMLHttpRequest();
    x.open('POST',API+path,true);
    x.setRequestHeader('Content-Type','application/x-www-form-urlencoded; charset=UTF-8');
    x.setRequestHeader('appid',TENANT.appid);
    x.timeout=15000;
    x.onload=function(){ try{resolve(JSON.parse(x.responseText));}catch(e){resolve(null);} };
    x.onerror=function(){ resolve(null); };
    x.ontimeout=function(){ resolve(null); };
    x.send(data);
  });
}
function limitRun(tasks,c){
  var i=0,res=[];
  return new Promise(function(done){
    var active=0,fin=0,total=tasks.length;
    if(!total) return done(res);
    function next(){
      while(active<c&&i<total){ (function(idx){ active++;
        tasks[idx]().then(function(r){ res[idx]=r; active--; fin++;
          if(fin===total) done(res); else next(); }); })(i++); }
    }
    next();
  });
}
function loadAll(){
  return postJSON('/user/Index/complexHome','').then(function(home){
    var list=(home&&home.data&&home.data.shop_cate)||[];
    var tasks=[],meta=[];
    list.forEach(function(c,idx){
      meta.push({id:c.shop_cate_id,name:c.shop_cate_name,shade:CAT_SHADES[idx%CAT_SHADES.length]});
      tasks.push(function(){
        var out=[],page=1,last=1;
        function step(){
          if(page>last) return Promise.resolve(out);
          return postJSON('/user/Index/cateShop','shop_cate_id='+c.shop_cate_id+'&page='+page).then(function(j){
            var d=(j&&j.data)||{}; last=d.last_page||1;
            (d.data||[]).forEach(function(s){
              s.cate_id=c.shop_cate_id; s.cate_name=c.shop_cate_name;
              s.shade=CAT_SHADES[idx%CAT_SHADES.length];
              s.appid=TENANT.appid; s.site=TENANT.site;
              s.dishes=null;
              out.push(s);
            });
            page++; return step();
          });
        }
        return step();
      });
    });
    return limitRun(tasks,4).then(function(lists){
      var merged=[],seen={};
      lists.forEach(function(rows){ (rows||[]).forEach(function(s){
        if(!seen[s.shop_id]){ seen[s.shop_id]=1; merged.push(s); } }); });
      return {shops:merged,cats:meta};
    });
  });
}

/* ---------- 每级的候选 ---------- */
function cateItems(){
  var p=pool(),map={},order=[];
  p.forEach(function(s){ var k=String(s.cate_id);
    if(!map[k]){ map[k]={id:s.cate_id,name:s.cate_name,shade:s.shade,shops:[]}; order.push(k); }
    map[k].shops.push(s); });
  return order.map(function(k){ return map[k]; });
}
function shopItems(){
  var p=pool();
  if(picked.cate) p=p.filter(function(s){ return String(s.cate_id)===String(picked.cate.id); });
  return p;
}
function dishItems(){
  var list = picked.shop ? dishesFor(picked.shop) : DEFAULT_DISHES;
  return list.map(function(x,i){ return {name:x, shade:DISH_SHADES[i%DISH_SHADES.length]}; });
}
function itemsOf(lv){
  if(lv===1) return cateItems();
  if(lv===2) return shopItems();
  return dishItems();
}

/* ---------- 画盘 ---------- */
var CX=170,CY=170,R=140;
function polar(r,deg){ var rad=(deg-90)*Math.PI/180; return [CX+r*Math.cos(rad),CY+r*Math.sin(rad)]; }
function drawWheel(items,opt){
  opt=opt||{};
  var n=items.length,parts=[];
  parts.push('<circle cx="170" cy="170" r="140" fill="#ffffff" stroke="#e2e7e3"/>');
  if(!n){ document.getElementById('svg').innerHTML=parts.join(''); return; }
  var seg=360/n, showText=n<=20;
  for(var i=0;i<n;i++){
    var it=items[i],a0=i*seg,a1=a0+seg;
    var p0=polar(R,a0),p1=polar(R,a1),large=(a1-a0)>180?1:0;
    var base=it.shade||opt.shade||'#ffffff';
    var fill=(i%2)?darken(base,7):base;
    parts.push('<path d="M170 170 L'+p0[0].toFixed(2)+' '+p0[1].toFixed(2)+' A140 140 0 '+large+
      ' 1 '+p1[0].toFixed(2)+' '+p1[1].toFixed(2)+' Z" fill="'+fill+
      '" stroke="#e3ebe6" stroke-width="0.8"/>');
    if(showText){
      var mid=a0+seg/2,tp=polar(R*0.66,mid),rot=mid+90;
      if(rot>90&&rot<270) rot-=180;
      var label=opt.label?opt.label(it):(it.name||it.shop_name||'');
      parts.push('<text x="'+tp[0].toFixed(1)+'" y="'+tp[1].toFixed(1)+'" text-anchor="middle" '+
        'dominant-baseline="middle" fill="#1a2e22" font-size="'+(n>12?9:12)+'" font-family="PingFang SC,sans-serif" '+
        'transform="rotate('+rot.toFixed(1)+' '+tp[0].toFixed(1)+' '+tp[1].toFixed(1)+')">'+
        esc(trunc(label,n>12?5:7))+'</text>');
    }
  }
  if(!showText&&opt.groupKey){
    var st=0;
    while(st<n){
      var g=opt.groupKey(items[st]),en=st;
      while(en<n&&opt.groupKey(items[en])===g) en++;
      var span=(en-st)*seg;
      if(span>=16){
        var md=(st+en)/2*seg,lp=polar(R+16,md),rot2=md+90;
        if(rot2>90&&rot2<270) rot2-=180;
        parts.push('<text x="'+lp[0].toFixed(1)+'" y="'+lp[1].toFixed(1)+'" text-anchor="middle" '+
          'dominant-baseline="middle" fill="#7d8b84" font-size="8" font-family="PingFang SC,sans-serif" '+
          'transform="rotate('+rot2.toFixed(1)+' '+lp[0].toFixed(1)+' '+lp[1].toFixed(1)+')">'+
          esc(opt.groupLabel?opt.groupLabel(items[st]):'')+'</text>');
      }
      st=en;
    }
  }
  parts.push('<circle cx="170" cy="170" r="56" fill="#ffffff" stroke="#eef1ee"/>');
  document.getElementById('svg').innerHTML=parts.join('');
}

function wheelOption(lv){
  if(lv===1) return { groupKey:function(c){return c.id;}, groupLabel:function(c){return c.name;},
                      label:function(c){return c.name;} };
  if(lv===2) return { shade:'#eef7f1', label:function(s){return s.shop_name;},
                      groupKey:function(s){return s.cate_id;}, groupLabel:function(s){return s.cate_name;} };
  return { label:function(d){return d.name;} };
}

function renderWheelFor(lv){
  wheelItems=itemsOf(lv);
  drawWheel(wheelItems, wheelOption(lv));
  // 回到该级常用角度，避免视觉跳变
  var rotor=document.getElementById('rotor');
  rotor.style.transition='none';
  rotor.style.transform='rotate('+rotation[lv]+'deg)';
  void rotor.offsetWidth;
  rotor.style.transition='';
  document.getElementById('hub').textContent='转';
}

/* ---------- 转当前级 ---------- */
function spinCurrent(){
  if(spinning) return;
  var items=itemsOf(level);
  if(!items.length){ alert('这一层没有可选项'); return; }
  spinning=true;
  var hub=document.getElementById('hub'); hub.disabled=true; hub.textContent='…';

  wheelItems=items;
  drawWheel(items,wheelOption(level));

  var rotor=document.getElementById('rotor');
  var n=items.length, seg=360/n;
  var idx=Math.floor(Math.random()*n);
  var jitter=(Math.random()-0.5)*seg*0.62;
  var target=(360-((idx+0.5)*seg+jitter)%360+360)%360;
  var cur=((rotation[level]%360)+360)%360;
  rotation[level]+=360*3+((target-cur+360)%360);
  rotor.style.transitionDuration='3000ms';
  rotor.style.transform='rotate('+rotation[level]+'deg)';

  var done=false;
  function finish(){
    if(done) return; done=true;
    setTimeout(function(){
      spinning=false; hub.disabled=false; hub.textContent='转';
      applyPick(level, items[idx]);
    },80);
  }
  rotor.addEventListener('transitionend',finish,{once:true});
  setTimeout(finish,3900);
}

function applyPick(lv,item){
  if(lv===1){
    picked.cate={ id:item.id, name:item.name };
    // 换了餐厅，若已选店不属于它则清掉
    if(picked.shop && String(picked.shop.cate_id)!==String(item.id)) picked.shop=null;
  }else if(lv===2){
    picked.shop=item;
    picked.cate={ id:item.cate_id, name:item.cate_name };
  }else{
    picked.dish=item.name;
  }
  saveLocal(); renderPicks(); renderTabs(); renderResult();
  histArr.unshift({ name: labelOf(lv,item), at: Date.now() });
  histArr=histArr.slice(0,12); saveLocal(); renderHist();
}

function labelOf(lv,item){
  if(lv===1) return '餐厅 · '+item.name;
  if(lv===2) return '窗口 · '+item.shop_name;
  return '菜品 · '+item.name;
}

/* ---------- 顶部选择 + 结果 ---------- */
function renderPicks(){
  var box=document.getElementById('picks'), html='';
  var rows=[[1,'餐厅',picked.cate?picked.cate.name:''],[2,'窗口',picked.shop?picked.shop.shop_name:''],[3,'菜品',picked.dish||'']];
  rows.forEach(function(r){
    if(r[2]) html+='<span class="pick"><i>'+r[1]+'</i>'+esc(r[2])+'<span class="x" data-clear="'+r[0]+'">×</span></span>';
    else html+='<span class="pick none"><i>'+r[1]+'</i>未选</span>';
  });
  box.innerHTML=html;
  Array.prototype.forEach.call(box.querySelectorAll('[data-clear]'),function(el){
    el.addEventListener('click',function(){
      var lv=+this.getAttribute('data-clear');
      if(lv===1){ picked.cate=null; picked.shop=null; }
      if(lv===2) picked.shop=null;
      if(lv===3) picked.dish=null;
      saveLocal(); renderPicks(); renderTabs(); renderResult();
      renderWheelFor(level);
    });
  });
}

function renderTabs(){
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
    t.classList.toggle('on', +t.getAttribute('data-lv')===level);
  });
  document.getElementById('n1').textContent=cateItems().length;
  document.getElementById('n2').textContent=shopItems().length;
  document.getElementById('n3').textContent=dishItems().length;
  var hint='';
  if(level===1) hint='转一个餐厅；转完「窗口」「菜品」会自动收窄到这家';
  if(level===2) hint= picked.cate ? ('只在「'+picked.cate.name+'」里转') : '全部 '+pool().length+' 家一起转';
  if(level===3) hint= picked.shop ? ('用「'+picked.shop.shop_name+'」的菜品分类转') : '没选店时用默认分类（主食/小吃/饮品/套餐）';
  document.getElementById('hint').textContent=hint;
}

function renderResult(){
  var box=document.getElementById('result');
  var shop=picked.shop;
  if(!shop && !picked.cate && !picked.dish){ box.style.display='none'; return; }
  var name = shop ? shop.shop_name : (picked.cate ? picked.cate.name : '');
  document.getElementById('rname').textContent = name || '还没选店';
  var img=document.getElementById('rimg');
  if(shop && shop.shop_logo){ img.src=shop.shop_logo; img.style.display='block'; } else img.style.display='none';
  var meta=[];
  if(picked.cate) meta.push(picked.cate.name);
  if(shop && shop.score) meta.push('评分 '+shop.score);
  if(shop && shop.month_sum) meta.push('月售 '+shop.month_sum);
  document.getElementById('rmeta').textContent=meta.join(' · ')||' ';
  document.getElementById('rpick').textContent = picked.dish? ('吃：'+picked.dish) : '';
  var go=document.getElementById('go');
  if(shop){
    go.href=H5+'?a='+(shop.appid||TENANT.appid)+'_'+(shop.site||TENANT.site)+'_'+encodeURIComponent(shop.shop_id);
    go.style.display='inline-block';
  }else{
    go.style.display='none';
  }
  box.style.display='block';
}

/* ---------- 列表 / 历史 ---------- */
function renderList(){
  var q=document.getElementById('q').value.trim().toLowerCase();
  var arr=shops.filter(function(s){ return !q||String(s.shop_name).toLowerCase().indexOf(q)>=0; });
  document.getElementById('cnt').textContent=shops.length+' 家 · 已选 '+pool().length;
  var html='';
  arr.forEach(function(s){
    var k=key(s),on=!!enabled[k];
    html+='<div class="row"><div class="rowtop">'+
      (s.shop_logo?'<img src="'+esc(s.shop_logo)+'" alt="" loading="lazy">':'')+
      '<div class="rinfo"><div class="rn">'+esc(s.shop_name)+'</div>'+
      '<div class="rm">'+esc(s.cate_name||'')+'</div></div>'+
      '<div class="sw'+(on?' on':'')+'" data-k="'+esc(k)+'"></div></div>'+
      '<div class="dishes">'+
      dishesFor(s).map(function(d){ return '<span class="dtag">'+esc(d)+'</span>'; }).join('')+
      '<span class="dedit" data-edit="'+esc(k)+'">编辑菜品分类</span></div></div>';
  });
  document.getElementById('list').innerHTML=html||'<div class="empty">没有匹配的店</div>';
  Array.prototype.forEach.call(document.querySelectorAll('#list .sw'),function(el){
    el.addEventListener('click',function(){
      var k=this.getAttribute('data-k');
      if(enabled[k]) delete enabled[k]; else enabled[k]=1;
      this.classList.toggle('on'); saveLocal();
      document.getElementById('cnt').textContent=shops.length+' 家 · 已选 '+pool().length;
      renderTabs(); renderWheelFor(level);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('#list .dedit'),function(el){
    el.addEventListener('click',function(){
      var k=this.getAttribute('data-edit');
      var s=shops.filter(function(x){ return key(x)===k; })[0]; if(!s) return;
      var v=prompt('这家店的菜品分类（用 / 分隔）',dishesFor(s).join('/'));
      if(v===null) return;
      var arr2=v.split(/[\/,，、\s]+/).filter(Boolean).slice(0,12);
      s.dishes=arr2.length?arr2:null;
      saveLocal(); renderList(); renderTabs(); renderWheelFor(level);
    });
  });
}

function renderHist(){
  var h='';
  if(!histArr.length) h='<span class="chip">还没有转过</span>';
  histArr.forEach(function(it){
    var d=new Date(it.at);
    var hm=(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
    var nm=it.name.length>14?it.name.slice(0,14)+'…':it.name;
    h+='<span class="chip"><b>'+esc(nm)+'</b> '+hm+'</span>';
  });
  document.getElementById('hist').innerHTML=h;
}

/* ---------- 启动 ---------- */
function setSrc(t,bad){ var e=document.getElementById('src'); e.textContent=t;
  e.style.color=bad?'#c0392b':'#8a948d'; }

function renderAll(){
  renderPicks(); renderTabs(); renderWheelFor(level); renderList(); renderHist(); renderResult();
}

function boot(force){
  if(!force&&loadLocal()){
    setSrc('本地缓存 '+shops.length+' 家 · 点「重新拉取」更新');
    renderAll(); return;
  }
  setSrc('正在拉取全部店铺…');
  loadAll().then(function(res){
    if(!res||!res.shops.length){ setSrc('接口没返回数据，点「重新拉取」',true); return; }
    shops=res.shops; cats=res.cats; enabled={};
    shops.forEach(function(s){ enabled[key(s)]=1; });
    if(picked.shop){ // 店可能已下线
      var found=shops.filter(function(s){ return key(s)===key(picked.shop); })[0];
      if(!found) picked.shop=null; else picked.shop=found;
    }
    saveLocal();
    setSrc('已加载 '+shops.length+' 家 · '+new Date().toTimeString().slice(0,5));
    renderAll();
  });
}

document.getElementById('hub').addEventListener('click', spinCurrent);
Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
  t.addEventListener('click',function(){
    if(spinning) return;
    level=+this.getAttribute('data-lv');
    renderTabs(); renderWheelFor(level);
  });
});
document.getElementById('refresh').addEventListener('click',function(){ boot(true); });
document.getElementById('copybtn').addEventListener('click',function(){
  var u=location.href.split('?')[0];
  if(navigator.clipboard){ navigator.clipboard.writeText(u); alert('链接已复制'); }
  else prompt('复制这个链接',u);
});
document.getElementById('clearAll').addEventListener('click',function(){
  picked={cate:null,shop:null,dish:null}; saveLocal();
  renderPicks(); renderTabs(); renderResult(); renderWheelFor(level);
});
document.getElementById('q').addEventListener('input',renderList);
document.getElementById('allOn').addEventListener('click',function(){
  shops.forEach(function(s){ enabled[key(s)]=1; }); saveLocal(); renderList(); renderTabs(); renderWheelFor(level);
});
document.getElementById('allOff').addEventListener('click',function(){
  enabled={}; saveLocal(); renderList(); renderTabs(); renderWheelFor(level);
});
document.getElementById('clr').addEventListener('click',function(){
  histArr=[]; saveLocal(); renderHist();
});

boot(false);
</script>
</body>
</html>
